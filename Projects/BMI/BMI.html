
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator with Enhanced Animation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            transition: background-color 0.5s, color 0.5s;
        }

        body.light-mode {
            background-color: #f4f4f4;
            color: #333;
        }

        body.dark-mode {
            background-color: #333;
            color: #f4f4f4;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 40px;
        }

        .form-container {
            max-width: 400px;
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        canvas {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        input[type="number"], button, .toggle-button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        button, .toggle-button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover, .toggle-button:hover {
            background-color: #0056b3;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        .radio-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body class="light-mode">
    <div class="container">
        <div class="form-container">
            <h2>BMI Calculator</h2>
            <label for="weight">Enter Weight (kg):</label>
            <input type="number" id="weight" placeholder="e.g., 70">
            
            <label for="height">Enter Height (cm):</label>
            <input type="number" id="height" placeholder="e.g., 175">
            
            <div class="radio-group">
                <label><input type="radio" name="gender" value="Male" checked> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
            </div>
            
            <button onclick="calculateBMI()">Calculate BMI</button>
            <h3 id="result"></h3>

            <div class="toggle-container">
                <button class="toggle-button" onclick="toggleMode()">Toggle Light/Dark Mode</button>
            </div>
        </div>
        <canvas id="animationCanvas" width="400" height="400"></canvas>
    </div>

    <script>
        let animationFrameId;
        let bmi = 0;
        let gender = 'Male';

        function calculateBMI() {
            const weight = parseFloat(document.getElementById("weight").value);
            const height = parseFloat(document.getElementById("height").value) / 100; // Convert cm to meters
            gender = document.querySelector('input[name="gender"]:checked').value;

            // Validate inputs
            if (isNaN(weight) || isNaN(height) || weight <= 0 || height <= 0) {
                alert("Please enter valid weight and height.");
                return;
            }

            bmi = (weight / (height * height)).toFixed(2);
            document.getElementById("result").innerText = `Your BMI: ${bmi} (${gender})`;
            startAnimation();
        }

        function startAnimation() {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(animate);
        }

        function animate() {
            const canvas = document.getElementById("animationCanvas");
            const ctx = canvas.getContext("2d");

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Set background
            ctx.fillStyle = "#f0f0f0";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Determine BMI category
            let color, text;
            if (bmi < 18.5) {
                color = "lightblue";
                text = "Underweight";
            } else if (bmi < 24.9) {
                color = "green";
                text = "Healthy";
            } else if (bmi < 29.9) {
                color = "orange";
                text = "Overweight";
            } else {
                color = "red";
                text = "Obese";
            }

            // Display BMI category
            ctx.fillStyle = color;
            ctx.font = "20px Arial";
            ctx.fillText(`BMI: ${bmi} (${text})`, 120, 30);

            // Draw character
            drawCharacter(ctx, gender, bmi);

            // Continue animation loop
            animationFrameId = requestAnimationFrame(animate);
        }

        function drawCharacter(ctx, gender, bmi) {
            const bodyColor = gender === "Male" ? "blue" : "pink";
            const scale = Math.min(Math.max(bmi / 25, 0.8), 1.5); // Scale character based on BMI

            ctx.fillStyle = bodyColor;

            // Head
            ctx.beginPath();
            ctx.arc(200, 150, 40 * scale, 0, Math.PI * 2);
            ctx.fill();

            // Body
            ctx.fillRect(180, 180, 50 * scale, 100 * scale);

            // Arms
            ctx.fillRect(150, 180, 40 * scale, 80 * scale);
            ctx.fillRect(220, 180, 40 * scale, 80 * scale);

            // Legs
            ctx.fillRect(180, 280, 30 * scale, 70 * scale);
            ctx.fillRect(210, 280, 30 * scale, 70 * scale);
        }

        function toggleMode() {
            const body = document.body;
            if (body.classList.contains('light-mode')) {
                body.classList.remove('light-mode');
                body.classList.add('dark-mode');
            } else {
                body.classList.remove('dark-mode');
                body.classList.add('light-mode');
            }
        }
    </script>
</body>
</html>
