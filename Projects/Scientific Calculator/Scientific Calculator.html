<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: #121212;
            color: #fff;
            text-align: center;
            transition: background 0.3s, color 0.3s;
        }

        .calculator {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .screen {
            width: 100%;
            height: 50px;
            font-size: 24px;
            text-align: right;
            padding: 10px;
            border: none;
            background: #333;
            color: #fff;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            background: #444;
            color: #fff;
        }

        button:hover {
            background: #666;
        }

        .toggle-mode {
            margin-top: 20px;
            padding: 10px 20px;
            background: #444;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
    </style>
</head>
<body>
    <h1>Scientific Calculator</h1>
    <button class="toggle-mode">Dark Mode</button>
    <div class="calculator">
        <input type="text" class="screen" id="screen" disabled>
        <div class="buttons">
            <button onclick="clearScreen()">C</button>
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue(')')">)</button>
            <button onclick="appendValue('/')">/</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('*')">*</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('-')">-</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('+')">+</button>
            
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="calculateResult()">=</button>
            <button onclick="appendValue('Math.sqrt(')">√</button>
            
            <button onclick="appendValue('Math.sin(')">sin</button>
            <button onclick="appendValue('Math.cos(')">cos</button>
            <button onclick="appendValue('Math.tan(')">tan</button>
            <button onclick="appendValue('Math.log(')">log</button>
        </div>
    </div>
    
    <script>
        const screen = document.getElementById("screen");
        const toggleMode = document.querySelector(".toggle-mode");
        let darkMode = true;

        function appendValue(value) {
            screen.value += value;
        }

        function clearScreen() {
            screen.value = "";
        }

        function calculateResult() {
            try {
                screen.value = eval(screen.value);
            } catch {
                screen.value = "Error";
            }
        }

        toggleMode.addEventListener("click", () => {
            darkMode = !darkMode;
            document.body.style.background = darkMode ? "#121212" : "#fff";
            document.body.style.color = darkMode ? "#fff" : "#000";
            toggleMode.textContent = darkMode ? "Dark Mode" : "Light Mode";
        });
    </script>
</body>
</html>
